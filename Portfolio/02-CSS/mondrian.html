<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondrian Composition - Grid Center</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* METHOD 1: Centering using CSS Grid instead of Flexbox */
        body {
            display: grid;
            place-items: center;       /* Centers all content vertically and horizontally */
            align-content: center;     /* Ensures rows stay grouped tightly in the center */
            min-height: 100vh;         /* Makes the body span the full height of the viewport */
            background-color: #f4f4f4;
            font-family: sans-serif;
            padding: 20px;
        }


        /* The Mondrian Canvas Layout */
        .canvas {
            display: grid;
            grid-template-columns: 120px 240px 80px 140px;
            grid-template-rows: 140px 160px 70px 110px;
            background-color: #000;
            gap: 10px; 
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 5px solid #000;
        }

        .block {
            background-color: #fff;
            transition: opacity 0.3s ease;
        }

        .red {
            background-color: #e51e25;
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }

        .blue {
            background-color: #005bb6;
            grid-column: 4 / 5;
            grid-row: 3 / 5;
        }

        .yellow {
            background-color: #f8cb13;
            grid-column: 1 / 2;
            grid-row: 4 / 5;
        }

        .top-right {
            grid-column: 3 / 5;
            grid-row: 1 / 2;
        }

        .middle-right {
            grid-column: 3 / 4;
            grid-row: 2 / 4;
        }

        .bottom-middle {
            grid-column: 2 / 4;
            grid-row: 4 / 5;
        }

        
    </style>
</head>
<body>

    <h1>Mondrian</h1>

    <div class="canvas">
        <div class="block red"></div>
        <div class="block top-right"></div>
        <div class="block middle-right"></div>
        <div class="block"></div> 
        <div class="block blue"></div>
        <div class="block yellow"></div>
        <div class="block bottom-middle"></div>
    </div>

</body>
</html>
